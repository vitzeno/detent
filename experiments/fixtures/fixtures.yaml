# Detent spike fixtures.
# Capture `world` output from a REAL machine — synthetic output
# is cleaner than reality and will flatter the model.
#
# `world` must hold output for capabilities the model might wrongly pick, not
# just the correct ones. A run has to be able to go astray to be measured.
# `reduced` holds hand-written facts standing in for reducers not yet built.

# --- genuine multi-step: step two depends on step one's result ---------------
- goal: "kill whatever's on port 3000"
  expected_sequence: [port_listeners, kill_process]
  world:
    port_listeners: |
      COMMAND  PID   USER  FD   TYPE  DEVICE   SIZE/OFF NODE NAME
      node     4821  m     23u  IPv6  0x8a2b3c      0t0  TCP *:3000 (LISTEN)
    process_list: |
      USER  PID    %CPU  %MEM  COMMAND
      m     4821    2.1   1.4  node server.js
      m     1122   44.8   8.2  chrome
      m     9930    0.3   0.5  zsh
    kill_process: |
      (no output)
  reduced:
    port_listeners: {port_3000: {pid: 4821, cmd: "node server.js"}}
    process_list:
      top_cpu:
        - {pid: 1122, cpu: 44.8, cmd: chrome}
        - {pid: 4821, cpu: 2.1, cmd: "node server.js"}
    kill_process: {result: terminated}

- goal: "kill the process eating the most CPU"
  expected_sequence: [process_list, kill_process]
  world:
    process_list: |
      USER  PID    %CPU  %MEM  COMMAND
      m     1122   44.8   8.2  chrome
      m     4821    2.1   1.4  node server.js
    port_listeners: |
      COMMAND  PID   USER  FD   TYPE  DEVICE   SIZE/OFF NODE NAME
      node     4821  m     23u  IPv6  0x8a2b3c      0t0  TCP *:3000 (LISTEN)
    kill_process: |
      (no output)
  reduced:
    process_list:
      top_cpu:
        - {pid: 1122, cpu: 44.8, cmd: chrome}
        - {pid: 4821, cpu: 2.1, cmd: "node server.js"}
    port_listeners: {port_3000: {pid: 4821, cmd: "node server.js"}}
    kill_process: {result: terminated}

