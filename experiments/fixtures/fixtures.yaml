- goal: "read whichever readme is in the skills project"
  expected_sequence: [list_files, read_file]
  world:
    list_files: |
      debug-dataroom.md  quiz.md  README.md  save-learning.md
    read_file: |
      # skills

      Custom Claude Code skills (slash commands). These live in `~/.claude/commands/` and are invoked with `/skill-name` in Claude Code.

      ## Skills

      ### `debug-dataroom`
      Diagnoses stuck or misbehaving data-room files using Azure Log Analytics. Runs four parallel KQL queries (table map, ingestion pipeline, blob storage, Databricks) and builds a timeline to identify the root cause.

      ### `save-learning`
      Saves a learning to the Notion notes workspace. Discovers the workspace structure, picks the right destination (Developer Setup, Generic Learnings, or project-specific Notes), and creates or appends to the relevant page.

      ### `quiz`
      Quizzes the user on any topic. Sources content from Notion by default (searching by topic across multiple pages and synthesising them) or from the web on request.
  reduced:
