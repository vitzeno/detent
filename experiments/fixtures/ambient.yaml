# Ambient world/reduced facts — captured 2026-09-19 from the same real machine
# as fixtures.yaml. These cover capabilities that don't take a goal-specific
# target (port_listeners, process_list, disk_usage, kill_process) or that a
# fixture didn't itself need but the model might still wrongly pick
# (git_status/git_log/list_files/find_files/read_file/search_content/tail_log).
#
# spike.py merges this UNDER each fixture's own world/reduced (fixture-specific
# entries always win), so a wrong pick never gets an empty/fabricated finding —
# it gets real output from this machine, just not scenario-specific output.
# This exists because make_fact() previously returned "" for any capability
# missing from a fixture's world, silently corrupting every step downstream of
# a wrong pick — the exact "reduction, not the model" trap SPIKE.md warns about.

