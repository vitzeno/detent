# Phase 0b: target/argument resolution fixtures. See docs/SPIKE_TARGET_RESOLUTION.md.
#
# Capability selection and candidate extraction are both held fixed here —
# each fixture supplies a goal, a capability that's already run, and the
# code-built candidate list its output produced. Only "which candidate does
# the goal mean" is being tested.
#
# Candidate values are reused from the real machine captures in fixtures.yaml
# and ambient.yaml wherever the category allows. The "ambiguous" category is
# the one deliberate exception: an exact tie is a specific structural case to
# test, not something likely to occur naturally in one capture, so those
# values are constructed (still realistic units/ranges) rather than found.

# --- unambiguous ---------------------------------------------------------------
- goal: "kill the node process"
  capability: kill_process
  category: unambiguous
  candidates:
    - id: pid_4821
      desc: "node server.js, PID 4821 — 2.1% CPU, 1.4% memory"
      fields: {pid: 4821, cmd: "node server.js", cpu_pct: 2.1, mem_pct: 1.4}
    - id: pid_1122
      desc: "chrome, PID 1122 — 44.8% CPU, 8.2% memory"
      fields: {pid: 1122, cmd: chrome, cpu_pct: 44.8, mem_pct: 8.2}
    - id: pid_9930
      desc: "zsh, PID 9930 — 0.3% CPU, 0.5% memory"
      fields: {pid: 9930, cmd: zsh, cpu_pct: 0.3, mem_pct: 0.5}
  expected_target: pid_4821

- goal: "kill whatever's listening on port 3000"
  capability: port_listeners
  category: unambiguous
  candidates:
    - id: port_52899
      desc: "rapportd, PID 1002, port 52899"
      fields: {port: 52899, pid: 1002, cmd: rapportd}
    - id: port_5000
      desc: "ControlCenter, PID 1345, port 5000"
      fields: {port: 5000, pid: 1345, cmd: ControlCenter}
    - id: port_3000
      desc: "node server.js, PID 4821, port 3000"
      fields: {port: 3000, pid: 4821, cmd: "node server.js"}
  expected_target: port_3000

- goal: "read the go module file"
  capability: read_file
  category: unambiguous
  candidates:
    - id: file_gomod
      desc: "go.mod"
      fields: {name: go.mod}
    - id: file_gosum
      desc: "go.sum"
      fields: {name: go.sum}
    - id: file_main
      desc: "main.go"
      fields: {name: main.go}
  expected_target: file_gomod

- goal: "kill process 1122"
  capability: kill_process
  category: unambiguous
  candidates:
    - id: pid_4821
      desc: "node server.js, PID 4821"
      fields: {pid: 4821, cmd: "node server.js"}
    - id: pid_1122
      desc: "chrome, PID 1122"
      fields: {pid: 1122, cmd: chrome}
  expected_target: pid_1122

