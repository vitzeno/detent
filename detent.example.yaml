# detent example configuration. Copy to .detent.yaml (repo-local) or
# ~/.config/detent/config.yaml and change what you need.
# Precedence: flags > environment > this file > built-ins.
#
# Every key is spelled out rather than commented, so an editor reads
# the file as YAML. An empty string or a 0 means "use the built-in",
# so copying this as-is changes nothing: fill in only what you want to
# override. The alternatives further down stay commented because YAML
# will not take the same key twice.

# --- Proposer: any OpenAI-compatible /chat/completions endpoint ---

# LM Studio, the local default. Works as-is with no key.
base_url: http://localhost:1234/v1
model: prism-ml/bonsai-27b
api_key: ""

# Extra request headers, for a provider that wants them.
headers: {}

# OpenRouter instead (needs OPENROUTER_API_KEY env or api_key above):
#   base_url: https://openrouter.ai/api/v1
#   model: qwen/qwen3-32b
#   headers:
#     HTTP-Referer: https://github.com/your/repo
#     X-Title: detent
#
# Hosted OpenAI instead (needs OPENAI_API_KEY env or api_key above):
#   base_url: https://api.openai.com/v1
#   model: gpt-4o-mini

# Per-goal step cap. 0 means unbounded: the human confirm on every
# dangerous command is the bound.
steps: 0

# How much of the model's context window the transcript may fill.
# Every proposal resends the whole thing, so without a ceiling a long
# session gets steadily more expensive and eventually overruns the
# window. Past it, the oldest turns are replaced by a summary the same
# model writes; what's left is the recent half plus that summary.
# 0 takes the built-in 24000, which suits a 32k model. Raise it if
# yours has more to spend, remembering the system prompt and the reply
# need room too.
context_tokens: 0

# --- Judge (Jev): classifier for confirm emphasis and row rendering ---
# Leave jev_api_key empty (and TYPESAFE_API_KEY unset) to run without a
# judge; rows stay heuristic and confirms stay neutral.

jev_api_key: ""
jev_model: ""
jev_endpoint: ""

# Scope-risk Noul floor for extra confirm emphasis. 0 takes the 0.5
# built-in.
risk_threshold: 0

# --- Theme: TUI colour scheme ---
# dark, light, solarized or dracula. Empty takes dark.
theme: ""

# --- Sandbox: per-command host vs. containerd-backed execution ---

# "auto" sandboxes by default; "host" never sandboxes. Empty takes auto.
sandbox_mode: ""

# Containerd socket. Empty picks the OS-conventional path (colima
# --runtime containerd on macOS, /run/containerd/containerd.sock on
# Linux). Set it if that guess is wrong, such as a non-default colima
# profile, or Windows, which has no safe default at all.
sandbox_socket: ""

# Image sandboxed commands run in. Must be a fully qualified ref:
# unlike docker and nerdctl, containerd's client does not expand Docker
# Hub shorthand itself. Empty takes Ubuntu plus git and curl, which is
# what makes goals work under sandbox_network: none. With no network
# the container cannot install tooling itself, so pick an image that
# already carries whatever your goals need.
sandbox_image: ""

# OCI runtime handle. Empty is containerd's own default, plain runc.
# "io.containerd.runsc.v1" switches to gVisor once that is installed
# and registered on the host.
sandbox_runtime: ""

# What the container can reach. "host" shares the network of whatever
# machine runs containerd: on macOS that is the colima VM, so your Mac
# stays behind the VM boundary; on Linux it is this machine, localhost
# services and LAN included. "none" leaves the container with loopback
# only, no DNS and nothing fetchable. Empty takes host.
sandbox_network: ""

# In-container mount point for the harness's working directory. The
# host side is always the directory detent was started in. Empty takes
# /workspace.
sandbox_workspace: ""

# --- Views: whether a view may be written for output nothing covers ---
#
# The pane always draws from a spec. The rendering for each judged
# shape is one, the ones detent ships for known commands are more, and
# any you have saved under ~/.local/state/detent/views are more again.
# The header says which of them drew what you are reading.
#
#   saved     draw only from specs that already exist. Asks nothing, so
#             that set never grows.
#   generate  do that first, and when nothing covers an output, compose
#             one by asking the judge where the header is, how to read
#             the bytes, which widget draws them, and which field each
#             one reads. About 600ms, then saved, so the next run of
#             that command shape is served from disk for nothing.
#
# generate needs jev_api_key: the judge is what writes a spec, so
# detent refuses the combination at startup rather than quietly
# behaving as saved.
views: saved

# --- Logs ---
#
# One structured log per session, at
# ~/.local/state/detent/logs/<session>.jsonl, one JSON record per line.
#
# It is a single stream rather than a file per component, because the
# thing anyone investigates is a step and a step crosses four or five
# of them. Every record carries session, goal, step, component and
# event, so filtering is a field match and correlating is too:
#
#   jq 'select(.step == 7)'                    everything about step 7
#   jq 'select(.component == "viewgen")'       one subsystem
#   jq 'select(.event | startswith("view."))'  one subsystem's events

log_level: info      # debug, info, warn, error
log_bodies: false    # record prompts, model replies and command output
log_dir: ""          # empty takes ~/.local/state/detent/logs

# --- MCP servers ---
#
# Tools an MCP server holds, so a credentialed service can be called
# without its credentials entering the sandbox. Each key namespaces
# that server's tools: "github" offers github__create_issue.
#
# These calls run in detent's own process, not the container, and no
# checkpoint can undo one. So every MCP call is confirmed, whatever
# the server says about itself.
#
# Set command or url, never both. env is what a launched server gets,
# on top of PATH, HOME, TMPDIR, LANG and USER; headers is where a
# bearer token goes. Neither reaches the container: these calls are
# made from detent's own process.
#
#   ./bin/detent -mcp     connect, list what each offers, exit
#
mcp: {}
# mcp:
#   github:                                    # launched, over stdio
#     command: docker
#     args: [run, -i, --rm, ghcr.io/github/github-mcp-server]
#     env:
#       GITHUB_PERSONAL_ACCESS_TOKEN: ghp_...
#   linear:                                    # reached, over HTTP
#     url: https://mcp.linear.app/mcp
#     headers:
#       Authorization: Bearer ...
#   notes:
#     command: /usr/local/bin/notes-mcp
#     disabled: true
