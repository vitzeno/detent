# Copy to ./.detent.yaml or ~/.config/detent/config.yaml.
# Precedence: flags > environment > this file > built-ins.
# Empty or 0 means the built-in, so this file as-is changes nothing.

# --- Model: any OpenAI-compatible /chat/completions endpoint ---

base_url: https://openrouter.ai/api/v1
model: openai/gpt-6-luna
api_key: ""            # or DETENT_API_KEY, OPENROUTER_API_KEY, OPENAI_API_KEY
headers: {}            # extra request headers

# Local LM Studio, no key:
#   base_url: http://localhost:1234/v1
# Hosted OpenAI:
#   base_url: https://api.openai.com/v1
#   model: gpt-4o-mini

steps: 0               # Steps per request before it asks to continue (100)

# Stop a command still running after this long, e.g. "30m" or "90s" (10m).
# Host, sandbox and MCP calls alike. The model is told it was stopped and sees
# what it printed so far. Also DETENT_COMMAND_TIMEOUT.
command_timeout: ""

# Before a request that changed something ends, ask the model once to check its
# work against the request (true). Also DETENT_FINISH_CHECK.
finish_check:          # true or false (true)

# Transcript budget in tokens (200000). Past it, the oldest Turns are
# summarised. Set it below the window for a small local model.
context_tokens: 0

# --- Jev judge: leave the key empty to run without one ---

jev_api_key: ""        # or TYPESAFE_API_KEY
jev_model: ""
jev_endpoint: ""
risk_threshold: 0      # scope risk that needs your approval (0.5)

# --- Look ---

theme: ""              # dark, light, solarized, dracula (dark)

# --- Sandbox ---

sandbox_mode: ""       # auto or host (auto)
sandbox_socket: ""     # containerd socket, empty guesses per OS
sandbox_image: ""      # fully qualified ref (Ubuntu with git and curl)
sandbox_runtime: ""    # OCI runtime, e.g. io.containerd.runsc.v1 (runc)
sandbox_network: ""    # host or none (host). On macOS host is the colima VM
sandbox_workspace: ""  # where your directory is mounted (/workspace)

# --- Views ---

# saved: draw only from specs that exist.
# generate: also compose one with Jev for output nothing covers (~600ms,
# then saved). Needs jev_api_key.
views: saved

# --- Logs: ~/.local/state/detent/logs/<session>.jsonl ---

log_level: info        # debug, info, warn, error
log_bodies: false      # include prompts, replies and command output
log_dir: ""

# MCP servers live in .mcp.json, not here. See mcp.example.json.
