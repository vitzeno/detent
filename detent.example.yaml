# detent example configuration. Copy to .detent.yaml (repo-local) or
# ~/.config/detent/config.yaml and uncomment what you need.
# Precedence: flags > environment > this file > built-ins.

# --- Proposer: any OpenAI-compatible /chat/completions endpoint ---

# LM Studio (local default — works as-is with no key):
base_url: http://localhost:1234/v1
model: prism-ml/bonsai-27b
# api_key: ""

# OpenRouter instead (needs OPENROUTER_API_KEY env or api_key below):
# base_url: https://openrouter.ai/api/v1
# model: qwen/qwen3-32b
# api_key: sk-or-...
# headers:
#   HTTP-Referer: https://github.com/your/repo
#   X-Title: detent

# Hosted OpenAI instead (needs OPENAI_API_KEY env or api_key below):
# base_url: https://api.openai.com/v1
# model: gpt-4o-mini

# Per-goal step cap. 0 (the default) means unbounded: the human confirm
# on every command is the bound.
# steps: 0

# How much of the model's context window the transcript may fill.
# Every proposal resends the whole thing, so without a ceiling a long
# session gets steadily more expensive and eventually overruns the
# window. Past it, the oldest turns are replaced by a summary the same
# model writes; what's left is the recent half plus that summary.
# The default suits a 32k model — raise it if yours has more to spend,
# and remember the system prompt and the reply need room too.
# context_tokens: 24000

# --- Judge (Jev): classifier for confirm emphasis and row rendering ---
# Omit jev_api_key (and TYPESAFE_API_KEY) to run without a judge; rows
# stay heuristic and confirms stay neutral.

# jev_api_key: apikey_...
# jev_model: jev-1.13.0
# jev_endpoint: https://api.typesafe.ai/v1/systemone

# Scope-risk Noul floor for extra confirm emphasis. 0 selects the 0.5 default.
# risk_threshold: 0.5

# --- Theme: TUI color scheme ---
# One of dark (default), light, solarized, dracula.
# theme: dark

# --- Sandbox: per-command host vs. containerd-backed execution ---
# "auto" (default) sandboxes by default; "host" never sandboxes.
# sandbox_mode: auto

# Containerd socket. Empty (default) picks the OS-conventional path
# (colima --runtime containerd on macOS, /run/containerd/containerd.sock
# on Linux) — set this if that guess is wrong (e.g. a non-default
# colima profile, or Windows, which has no safe default at all).
# sandbox_socket: /run/containerd/containerd.sock

# Image sandboxed commands run in. Must be a fully qualified ref —
# unlike docker/nerdctl, containerd's client doesn't expand Docker Hub
# shorthand itself. The default is Ubuntu plus git/curl, which is what
# makes goals work under sandbox_network: none — with no network the
# container can't install tooling itself, so pick an image that already
# carries whatever your goals need.
# sandbox_image: docker.io/library/buildpack-deps:24.04-scm

# OCI runtime handle. Empty (default) is containerd's own default
# (plain runc); "io.containerd.runsc.v1" switches to gVisor once
# that's installed and registered on the host.
# sandbox_runtime: ""

# What the container can reach. "host" (default) shares the network of
# whatever machine runs containerd — on macOS that is the colima VM, so
# your Mac stays behind the VM boundary; on Linux it is this machine,
# localhost services and LAN included. "none" leaves the container with
# loopback only: no DNS, nothing fetchable.
# sandbox_network: host

# In-container mount point for the harness's working directory. The
# host side is always the directory detent was started in.
# sandbox_workspace: /workspace
