name: detent CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
        # Drafts are skipped, so a draft runs once marked ready.
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

# Each job has a time limit, and skips draft PRs.

jobs:
    test:
        name: Test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        if: ${{ !github.event.pull_request.draft }}
        timeout-minutes: 20
        # Windows reports but does not fail the run until it has been green a while.
        continue-on-error: ${{ matrix.experimental == true }}
        strategy:
            # Every platform reports independently; one failure should not hide
            # the others, since platform differences are the point of the matrix.
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
                include:
                    # Host mode only: the sandbox needs a unix socket. The runner
                    # has PowerShell 7, so the pwsh tests run rather than skip.
                    - os: windows-latest
                      experimental: true
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Setup Go
              uses: ./.github/actions/go/setup

            - name: Show the PowerShell the tests will find
              if: runner.os == 'Windows'
              run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

            # The sandbox tests skip themselves without a containerd daemon,
            # which is the case here. Rollback is covered locally.
            - name: Run Go tests
              uses: ./.github/actions/go/tests
              with:
                  # The race detector needs cgo on Windows, which the runner lacks.
                  race: ${{ runner.os != 'Windows' }}

    fuzz:
        name: Fuzz
        runs-on: ubuntu-latest
        if: ${{ !github.event.pull_request.draft }}
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                # go test -fuzz takes one target at a time.
                target:
                    - FuzzExtractLines
                    - FuzzExtractColumns
                    - FuzzExtractJSON
                    - FuzzExtractFixed
                    - FuzzExtractPairs
                    - FuzzExtractDelimited
                    - FuzzExtractIndent
                    - FuzzExtractPrefix
                    - FuzzExtractBox
                    - FuzzExtractNone
                    - FuzzNumber
                include:
                    # The finder's matcher reads output nothing controls, as viewspec does.
                    - target: FuzzMatch
                      pkg: ./ui/search/
                    - target: FuzzPrintable
                      pkg: ./termsafe/
                    - target: FuzzParse
                      pkg: ./internal/review/
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Setup Go
              uses: ./.github/actions/go/setup

            - name: Fuzz ${{ matrix.target }}
              run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 20s ${{ matrix.pkg || './viewspec/' }}

    lint:
        name: Format and vet
        runs-on: ubuntu-latest
        if: ${{ !github.event.pull_request.draft }}
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Setup Go
              uses: ./.github/actions/go/setup

            - name: Check formatting
              run: |
                  set -euo pipefail
                  unformatted=$(gofmt -l .)
                  if [ -n "$unformatted" ]; then
                      echo "These files need gofmt:"
                      echo "$unformatted"
                      exit 1
                  fi

            - name: Vet
              run: go vet ./...

            - name: Lint
              uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
              with:
                  version: v2.11.4

            - name: Check go.mod is tidy
              run: |
                  set -euo pipefail
                  go mod tidy
                  git diff --exit-code -- go.mod go.sum

    cross-build:
        name: Cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
        runs-on: ubuntu-latest
        if: ${{ !github.event.pull_request.draft }}
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                include:
                    - goos: darwin
                      goarch: arm64
                    - goos: darwin
                      goarch: amd64
                    - goos: linux
                      goarch: arm64
                    - goos: linux
                      goarch: amd64
                    - goos: windows
                      goarch: amd64
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Setup Go
              uses: ./.github/actions/go/setup

            # CGO stays off so every target is one static binary, which is
            # why the store uses modernc's pure-Go SQLite.
            - name: Build
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
                  CGO_ENABLED: "0"
              run: go build -o /dev/null ./cmd/detent
