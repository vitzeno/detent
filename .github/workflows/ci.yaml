name: detent CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            # Every platform reports independently; one failure should not hide
            # the others, since platform differences are the point of the matrix.
            fail-fast: false
            matrix:
                # No Windows: commands go through `sh -c` and the sandbox needs
                # a unix socket. It still cross-builds below, so nothing rots.
                os:
                    - ubuntu-latest
                    - macos-latest
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup Go
              uses: ./.github/actions/go/setup

            # sandbox and routing skip themselves without a containerd
            # daemon, which is the case here. Rollback is covered locally.
            - name: Run Go tests
              uses: ./.github/actions/go/tests

    lint:
        name: Format and vet
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup Go
              uses: ./.github/actions/go/setup

            - name: Check formatting
              run: |
                  set -euo pipefail
                  unformatted=$(gofmt -l .)
                  if [ -n "$unformatted" ]; then
                      echo "These files need gofmt:"
                      echo "$unformatted"
                      exit 1
                  fi

            - name: Vet
              run: go vet ./...

            - name: Check go.mod is tidy
              run: |
                  set -euo pipefail
                  go mod tidy
                  git diff --exit-code -- go.mod go.sum

    cross-build:
        name: Cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - goos: darwin
                      goarch: arm64
                    - goos: darwin
                      goarch: amd64
                    - goos: linux
                      goarch: arm64
                    - goos: linux
                      goarch: amd64
                    - goos: windows
                      goarch: amd64
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup Go
              uses: ./.github/actions/go/setup

            # CGO stays off so every target is one static binary. It is also
            # what makes a pure-Go SQLite driver the only option later.
            - name: Build
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
                  CGO_ENABLED: "0"
              run: go build -o /dev/null ./cmd/detent
