# detent -init writes this to ~/.config/detent/config.yaml. ./.detent.yaml sets one repository's over it.
# Flags > environment > this file > built-ins. Empty or 0 is the built-in, shown in brackets.
# Each key also reads DETENT_<KEY>, except steps, headers, jev_*, risk_threshold,
# sandbox_image and sandbox_workspace. An unknown key is an error.

# --- Model: any OpenAI-compatible /chat/completions endpoint ---

base_url: https://openrouter.ai/api/v1   # LM Studio: http://localhost:1234/v1
model: openai/gpt-6-luna
api_key: ""                # or OPENROUTER_API_KEY, OPENAI_API_KEY
headers: {}                # extra request headers

steps: 0                   # Steps before it asks to continue (100)
command_timeout: ""        # stop a command after this long, e.g. 30m (10m)
finish_check:              # ask the model to check its work before finishing (true)
context_tokens: 0          # transcript budget before compacting (200000)

# --- Subagents ---

subagents:                 # let the model hand work to subagents (false)
max_agents: 0              # per request (10)
child_context_tokens: 0    # one subagent's budget (64000)
child_timeout: ""          # how long one may run (10m)
review_model: ""           # the model /review's reviewer speaks as (the session's)

# --- Jev judge: empty key runs without one ---

jev_api_key: ""            # or TYPESAFE_API_KEY
jev_model: ""
jev_endpoint: ""
risk_threshold: 0          # scope risk that needs approval (0.5)
jev_fail_closed:           # ask about a call the judge could not answer for (false)

# --- MCP: servers live in .mcp.json ---

mcp_trust_hints:           # run tools a server marks read-only unasked (true)

# --- Look and shell ---

theme: ""                  # dark, light, solarized, dracula (dark)
host_shell: ""             # sh, pwsh or gitbash (sh, on Windows pwsh then gitbash)
views: saved               # saved, or generate to compose new views with Jev

# --- Sandbox ---

sandbox_mode: ""           # host, or auto for the experimental sandbox (host)
sandbox_socket: ""         # containerd socket (guessed per OS)
sandbox_image: ""          # fully qualified ref (Ubuntu with git and curl)
sandbox_runtime: ""        # OCI runtime, e.g. io.containerd.runsc.v1 (runc)
sandbox_network: ""        # host or none (host)
sandbox_workspace: ""      # where your directory is mounted (/workspace)

# --- Logs: ~/.local/state/detent/logs/<session>.jsonl ---

log_level: info            # debug, info, warn, error
log_bodies: false          # include prompts, replies and output
log_dir: ""
